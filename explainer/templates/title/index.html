<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">
<title>Title Card</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1280px;
  height: 720px;
  overflow: hidden;
  font-family: var(--font, sans-serif);
  background: var(--bg, #0d1b2a);
  color: #ffffff;
}
.container {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px;
}
.title {
  font-size: 64px;
  font-weight: 700;
  text-align: center;
  color: var(--accent, #4fc3f7);
  opacity: 0;
  transform: translateY(20px);
  transition: none;
  line-height: 1.2;
  max-width: 1000px;
}
.subtitle {
  font-size: 32px;
  font-weight: 400;
  text-align: center;
  color: #b0bec5;
  margin-top: 24px;
  opacity: 0;
  transform: translateY(16px);
  transition: none;
  max-width: 900px;
  line-height: 1.4;
}
.accent-line {
  width: 0;
  height: 4px;
  background: var(--accent, #4fc3f7);
  margin-top: 32px;
  border-radius: 2px;
  transition: none;
}
</style>
</head>
<body>
<div class="container">
  <div class="title" id="title"></div>
  <div class="accent-line" id="accent-line"></div>
  <div class="subtitle" id="subtitle"></div>
</div>
<script>
(function() {
  "use strict";

  var sceneTitle = "";
  var sceneSubtitle = "";

  // Utility: clamp value between min and max
  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  // Utility: ease-out cubic
  function easeOut(x) {
    return 1 - (1 - x) * (1 - x) * (1 - x);
  }

  // Utility: compute sub-progress within a window [start, end]
  function seg(t, start, end) {
    return clamp((t - start) / (end - start), 0, 1);
  }

  /**
   * Called once before frame capture begins.
   * Populates DOM with scene data.
   * @param {object} data - Scene data (title, subtitle from script)
   * @param {object} style - Style overrides (bg, accent, font)
   */
  window.setSceneData = function(data, style) {
    sceneTitle = (data && data.title) || "";
    sceneSubtitle = (data && data.subtitle) || "";

    document.getElementById("title").textContent = sceneTitle;
    document.getElementById("subtitle").textContent = sceneSubtitle;

    // Apply style overrides
    if (style) {
      if (style.bg) document.body.style.setProperty("--bg", style.bg);
      if (style.accent) document.body.style.setProperty("--accent", style.accent);
      if (style.font) document.body.style.setProperty("--font", style.font);
    }
  };

  /**
   * Called per frame. Renders visual state at progress t in [0, 1].
   * Pure function of t — deterministic, no side effects beyond DOM updates.
   *
   * Animation timeline:
   *   t = 0.0 → 0.3: Title fades in and slides up
   *   t = 0.3 → 0.6: Subtitle reveals, accent line grows
   *   t = 0.6 → 1.0: Hold (fully visible)
   *
   * @param {number} t - Progress value in [0, 1]
   */
  window.renderFrame = function(t) {
    var titleEl = document.getElementById("title");
    var subtitleEl = document.getElementById("subtitle");
    var lineEl = document.getElementById("accent-line");

    // Phase 1: Title fade-in (0 → 0.3)
    var titleProgress = easeOut(seg(t, 0, 0.3));
    titleEl.style.opacity = titleProgress;
    titleEl.style.transform = "translateY(" + (20 * (1 - titleProgress)) + "px)";

    // Phase 2: Accent line + Subtitle reveal (0.3 → 0.6)
    var subProgress = easeOut(seg(t, 0.3, 0.6));
    lineEl.style.width = (120 * subProgress) + "px";
    subtitleEl.style.opacity = subProgress;
    subtitleEl.style.transform = "translateY(" + (16 * (1 - subProgress)) + "px)";

    // Phase 3: Hold (0.6 → 1.0) — everything stays fully visible
  };
})();
</script>
</body>
</html>
