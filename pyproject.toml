[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "explainer-studio"
version = "0.1.0"
description = "Generate educational explainer videos from a topic string"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Explainer Studio Contributors" },
]
keywords = ["video", "education", "explainer", "tts", "animation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "playwright>=1.40",
    "edge-tts>=6.0",
    "litellm>=1.0",
    # Required by Script.validate_with_templates(); previously only present as a
    # transitive dependency of litellm.
    "jsonschema>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
elevenlabs = ["elevenlabs>=1.0"]
azure = ["azure-cognitiveservices-speech>=1.30"]
openai = ["openai>=1.0"]
dev = [
    "pytest",
    "pytest-regressions",
    "ruff",
    "mypy",
    "respx",
    "types-jsonschema",
    # Always install so mypy (python_version=3.10) can resolve the
    # Python < 3.11 import branch even when CI itself runs on 3.11+.
    "tomli>=2.0",
]

[project.scripts]
explainer = "explainer.cli:app"

[project.urls]
Homepage = "https://github.com/pramodthe/explainer-studio"
Documentation = "https://pramodthe.github.io/explainer-studio/"
Repository = "https://github.com/pramodthe/explainer-studio"

[project.entry-points."explainer.templates"]
title = "explainer.templates.title:get_path"
concept = "explainer.templates.concept:get_path"
steps = "explainer.templates.steps:get_path"
compare = "explainer.templates.compare:get_path"
chart = "explainer.templates.chart:get_path"
takeaway = "explainer.templates.takeaway:get_path"
animation = "explainer.templates.animation:get_path"

[project.entry-points."explainer.providers"]
llm_litellm = "explainer.providers.llm_litellm:LiteLLMProvider"
llm_heuristic = "explainer.providers.llm_heuristic:HeuristicProvider"
tts_edge = "explainer.providers.tts_edge:EdgeTTSProvider"
tts_elevenlabs = "explainer.providers.tts_elevenlabs:ElevenLabsTTSProvider"
tts_azure = "explainer.providers.tts_azure:AzureTTSProvider"
tts_openai = "explainer.providers.tts_openai:OpenAITTSProvider"

[tool.hatch.build.targets.wheel]
packages = ["explainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers are applied automatically by directory in tests/conftest.py.
markers = [
    "unit: unit tests",
    "golden: golden/snapshot tests (require Playwright + Chromium)",
    "e2e: end-to-end tests (may require Playwright, Chromium, and ffmpeg)",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Pinned explicitly so CI results don't drift with ruff's default rule set.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "BLE",  # flake8-blind-except
    "PLW",  # pylint warnings
]
# `ruff format` owns line length; the leftovers are strings/comments it cannot split.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer expresses CLI options as function-call defaults — B008 is unavoidable.
"explainer/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party packages without bundled type information.
module = ["litellm.*", "edge_tts.*", "elevenlabs.*", "azure.*"]
ignore_missing_imports = true
